<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>CosmicBrain social card · gallery edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;650&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #0d0d0b;
        color: #eeeae1;
        font-family: "DM Sans", sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
      }
      .brand {
        position: absolute;
        top: 53px;
        left: 58px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 52px;
        height: 52px;
        border-radius: 12px;
      }
      .brand span {
        font-size: 37px;
        font-weight: 650;
        letter-spacing: -1.8px;
        line-height: 1;
      }
      .brand i {
        color: #b99470;
        font-style: normal;
      }
      .kicker {
        position: absolute;
        left: 60px;
        top: 155px;
        margin: 0;
        font:
          11px "DM Mono",
          monospace;
        letter-spacing: 1.7px;
        color: #b99470;
        text-transform: uppercase;
      }
      h1 {
        position: absolute;
        left: 57px;
        top: 197px;
        margin: 0;
        font:
          400 82px/0.99 "Instrument Serif",
          serif;
        letter-spacing: -1.8px;
      }
      h1 span,
      h1 em {
        display: block;
      }
      h1 em {
        color: #c5a17d;
        font-weight: 400;
      }
      .purpose {
        position: absolute;
        left: 61px;
        top: 475px;
        margin: 0;
        font-size: 16px;
        color: #aaa69a;
        letter-spacing: -0.1px;
      }
      .footer {
        position: absolute;
        left: 60px;
        right: 542px;
        bottom: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 19px;
        border-top: 1px solid #36342c;
      }
      .address {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.1px;
      }
      .equation {
        font:
          italic 25px "Instrument Serif",
          serif;
        color: #b99470;
      }
      .photo {
        position: absolute;
        right: 43px;
        top: 42px;
        width: 449px;
        height: 546px;
        margin: 0;
        padding: 8px 8px 0;
        border: 1px solid #484134;
        border-radius: 2px;
        background: #151510;
        box-shadow: 0 9px 30px #00000030;
      }
      .photo img {
        display: block;
        width: 431px;
        height: 490px;
        object-fit: cover;
        object-position: 53% 50%;
        border-radius: 0;
      }
      .photo figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 45px;
        padding-inline: 9px;
        color: #c3b29c;
      }
      .photo figcaption span {
        font:
          italic 19px "Instrument Serif",
          serif;
      }
      .photo figcaption svg {
        width: 28px;
        height: 16px;
      }
      .rule {
        position: absolute;
        left: 674px;
        top: 45px;
        height: 539px;
        border-left: 1px dashed #5a4e3d;
      }
      .rule::before,
      .rule::after {
        position: absolute;
        content: "";
        left: -5px;
        width: 9px;
        border-top: 1px solid #a28766;
      }
      .rule::after {
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="CosmicBrain: A human touch for a robotic world">
      <div class="brand">
        <img src="../brand/cosmicbrain-logo.png" alt="CosmicBrain company logo" />
        <span>cosmicbrain<i>.</i></span>
      </div>
      <p class="kicker">Robots that learn from people</p>
      <h1><span>A human touch</span><span>for a robotic</span><em>world.</em></h1>
      <p class="purpose">Human ideas. Physical intelligence.</p>
      <div class="footer">
        <span class="address">cosmicbrain.ai</span><span class="equation">x = f(θ)</span>
      </div>
      <div class="rule" aria-hidden="true"></div>
      <figure class="photo">
        <img
          src="../media/deployment/hallway-delivery.png"
          alt="A black humanoid robot carries a woven basket in a warmly lit hallway."
        />
        <figcaption>
          <span>A little help, in the real world.</span
          ><svg
            viewBox="0 0 28 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            aria-hidden="true"
          >
            <path d="M1 8h24m-7-6 7 6-7 6" />
          </svg>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
