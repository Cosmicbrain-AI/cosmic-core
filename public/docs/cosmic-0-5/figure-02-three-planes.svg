<svg width="940" height="400" style="color:#3A3A33;background:#FFFFFF" class="diagram" viewBox="0 0 940 400" role="img" aria-label="Architecture diagram: four capture modalities feed a canonical motion representation, which is refined and retargeted into a robot action bundle, which is gated by Mission Control before reaching hardware." xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
        </marker>
        <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#1B3A66"/>
        </marker>
      </defs>

      <text x="20" y="26" font-family="monospace" font-size="11" fill="currentColor" letter-spacing="1.5" opacity=".65">CAPTURE PLANE</text>
      <text x="360" y="26" font-family="monospace" font-size="11" fill="currentColor" letter-spacing="1.5" opacity=".65">MOTION PLANE</text>
      <text x="700" y="26" font-family="monospace" font-size="11" fill="currentColor" letter-spacing="1.5" opacity=".65">EXECUTION PLANE</text>
      <line x1="330" y1="40" x2="330" y2="380" stroke="currentColor" stroke-width="1" stroke-dasharray="3 5" opacity=".28"/>
      <line x1="670" y1="40" x2="670" y2="380" stroke="currentColor" stroke-width="1" stroke-dasharray="3 5" opacity=".28"/>

      <g font-family="monospace" font-size="11.5" fill="currentColor">
        <rect x="20" y="60" width="200" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <text x="34" y="80">Monocular video</text><text x="34" y="96" opacity=".6" font-size="10">phone, webcam, archive</text>

        <rect x="20" y="130" width="200" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <text x="34" y="150">Egocentric RGB-D + IMU</text><text x="34" y="166" opacity=".6" font-size="10">head-mounted capture rig</text>

        <rect x="20" y="200" width="200" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <text x="34" y="220">VR teleoperation</text><text x="34" y="236" opacity=".6" font-size="10">MimicXR &#183; any WebXR headset</text>

        <rect x="20" y="270" width="200" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <text x="34" y="290">Simulation</text><text x="34" y="306" opacity=".6" font-size="10">MuJoCo household tasks</text>
      </g>

      <g stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#ah)">
        <path d="M220 83 L262 83 L262 176 L300 176"/>
        <path d="M220 153 L262 153 L262 172 L300 172"/>
        <path d="M220 223 L262 223 L262 184 L300 184"/>
        <path d="M220 293 L262 293 L262 188 L300 188"/>
      </g>
      <text x="228" y="76" font-family="monospace" font-size="9.5" fill="currentColor" opacity=".6">frames + confidence</text>

      <g font-family="monospace" font-size="11.5">
        <rect x="360" y="140" width="270" height="80" rx="3" fill="none" stroke="#1B3A66" stroke-width="1.8"/>
        <text x="376" y="166" fill="#1B3A66" font-size="12.5">Canonical motion (SOMA)</text>
        <text x="376" y="186" fill="currentColor" opacity=".7" font-size="10">fuse &#183; filter &#183; refine &#183; infill</text>
        <text x="376" y="204" fill="currentColor" opacity=".7" font-size="10">embodiment-independent</text>

        <rect x="360" y="256" width="270" height="72" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <text x="376" y="280" fill="currentColor">Retargeter + hand profile</text>
        <text x="376" y="298" fill="currentColor" opacity=".7" font-size="10">joint clamp &#183; velocity limit</text>
        <text x="376" y="315" fill="currentColor" opacity=".7" font-size="10">feet stabilisation</text>
      </g>
      <path d="M495 220 L495 256" stroke="#1B3A66" stroke-width="1.5" fill="none" marker-end="url(#ahA)"/>

      <path d="M630 292 L700 292 L700 232" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
      <text x="640" y="284" font-family="monospace" font-size="9.5" fill="currentColor" opacity=".6">.npz bundle</text>

      <g font-family="monospace" font-size="11.5" fill="currentColor">
        <rect x="700" y="150" width="220" height="78" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <text x="716" y="174">Mission Control</text>
        <text x="716" y="193" opacity=".7" font-size="10">ghost preview &#183; arming gate</text>
        <text x="716" y="210" opacity=".7" font-size="10">collision check &#183; governor</text>

        <rect x="700" y="266" width="220" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <text x="716" y="286">Robot &#183; 29 DoF</text>
        <text x="716" y="302" opacity=".6" font-size="10">lowcmd over ROS 2</text>
      </g>
      <path d="M810 228 L810 266" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
      <text x="820" y="252" font-family="monospace" font-size="9.5" fill="currentColor" opacity=".6">if armed</text>

      <path d="M900 266 L900 358 L360 358 L360 220" stroke="currentColor" stroke-width="1.1" fill="none" stroke-dasharray="4 4" marker-end="url(#ah)" opacity=".75"/>
      <text x="600" y="352" font-family="monospace" font-size="9.5" fill="currentColor" opacity=".6">telemetry &#183; 29-DoF position, velocity, torque</text>
    </svg>