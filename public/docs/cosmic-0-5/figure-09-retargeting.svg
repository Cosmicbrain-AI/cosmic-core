<svg width="900" height="330" style="color:#3A3A33;background:#FFFFFF" class="diagram" viewBox="0 0 900 330" role="img" aria-label="Diagram showing one canonical motion fanning out through a retarget profile into three different robot embodiments, with body-relative timing preserved and joint ranges differing per target." xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
        </marker>
      </defs>
      <g font-family="monospace" fill="currentColor">
        <rect x="20" y="130" width="190" height="66" rx="3" fill="none" stroke="#1B3A66" stroke-width="1.6"/>
        <text x="36" y="155" font-size="12" fill="#1B3A66">Canonical motion</text>
        <text x="36" y="173" font-size="9.5" opacity=".7">captured once</text>
        <text x="36" y="188" font-size="9.5" opacity=".7">no robot in it</text>

        <path d="M210 163 L268 163" stroke="currentColor" stroke-width="1.3" marker-end="url(#r1)"/>

        <rect x="270" y="106" width="200" height="114" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="286" y="130" font-size="12">Retarget profile</text>
        <text x="286" y="151" font-size="9.5" opacity=".72">joint ranges</text>
        <text x="286" y="168" font-size="9.5" opacity=".72">velocity ceilings</text>
        <text x="286" y="185" font-size="9.5" opacity=".72">hand kinematics</text>
        <text x="286" y="202" font-size="9.5" opacity=".72">foot contact model</text>

        <path d="M470 140 L520 140 L520 62 L568 62" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#r1)"/>
        <path d="M470 163 L540 163 L568 163" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#r1)"/>
        <path d="M470 186 L520 186 L520 264 L568 264" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#r1)"/>

        <rect x="570" y="38" width="300" height="48" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <text x="586" y="60" font-size="11.5">G1 &#183; 29 DoF &#183; revo2 hand</text>
        <text x="586" y="76" font-size="9.5" opacity=".65">production target: lowcmd over ROS 2</text>

        <rect x="570" y="139" width="300" height="48" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".8"/>
        <text x="586" y="161" font-size="11.5">Alternate humanoid</text>
        <text x="586" y="177" font-size="9.5" opacity=".65">new profile, same recording</text>

        <rect x="570" y="240" width="300" height="48" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".8"/>
        <text x="586" y="262" font-size="11.5">Simulation body</text>
        <text x="586" y="278" font-size="9.5" opacity=".65">deterministic replay surface</text>

        <text x="270" y="255" font-size="10" opacity=".6">invariant across targets:</text>
        <text x="270" y="272" font-size="10" opacity=".6">task timing, contact order, intent</text>
        <text x="270" y="289" font-size="10" opacity=".6">variant: joint angles, reach, grasp aperture</text>
      </g>
    </svg>